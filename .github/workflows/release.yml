name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify baseline release tag exists
        run: |
          if ! git tag -l 'v*' | grep -q .; then
            echo "::error::v* タグが1つも存在しません。npmには既に $(node -p "require('./package.json').version") が公開済みのため、" \
                 "先にそのバージョンを指すベースラインタグ（例: v$(node -p "require('./package.json').version")）を手動で作成・pushしてください。" \
                 "タグが無い状態でsemantic-releaseを実行すると1.0.0から採番され、npmのlatestタグが既存の公開バージョンより古い番号で上書きされる恐れがあります。"
            exit 1
          fi

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
